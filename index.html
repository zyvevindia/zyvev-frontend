<!DOCTYPE html>

<html lang="en">

  <head>

    <!-- =====================================================
         ================== BASIC META =======================
         ===================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />

    <!-- =====================================================
         ====================== TITLE ========================
         ===================================================== -->

    <title>
      EVSavari — Electric Vehicle Marketplace in India
    </title>

    <!-- =====================================================
         ==================== SEO META =======================
         ===================================================== -->

    <meta
      name="description"
      content="Explore, compare, and discover electric vehicles in India with EVSavari."
    />

    <meta
      name="keywords"
      content="EV marketplace India, electric cars India, EVSavari"
    />

    <meta
      name="author"
      content="EVSavari"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- =====================================================
         ==================== THEME COLOR ====================
         ===================================================== -->

    <meta
      name="theme-color"
      content="#0f172a"
    />

    <!-- =====================================================
         ===================== OPEN GRAPH ====================
         ===================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="EVSavari — Electric Vehicle Marketplace in India"
    />

    <meta
      property="og:description"
      content="Explore, compare, and discover electric vehicles in India with EVSavari."
    />

    <meta
      property="og:url"
      content="https://evsavari.com"
    />

    <meta
      property="og:image"
      content="https://evsavari.com/og-image.jpg"
    />

    <!-- =====================================================
         ====================== TWITTER ======================
         ===================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="EVSavari — Electric Vehicle Marketplace in India"
    />

    <meta
      name="twitter:description"
      content="Explore, compare, and discover electric vehicles in India with EVSavari."
    />

    <meta
      name="twitter:image"
      content="https://evsavari.com/og-image.jpg"
    />

    <!-- =====================================================
         ===================== CANONICAL =====================
         ===================================================== -->

    <link
      rel="canonical"
      href="https://evsavari.com"
    />

    <!-- =====================================================
         ====================== FAVICON ======================
         ===================================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- =====================================================
         ======================= FONTS =======================
         ===================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

  </head>

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>

</html>
