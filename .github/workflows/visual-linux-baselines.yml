# Canonical visual regression baselines — generate and validate on Linux only.
#
# Use this workflow to replace Windows-generated PNGs with Linux-authoritative baselines
# for Chromium, Firefox, and WebKit (168 PNGs total).
#
# Run: GitHub → Actions → "Visual Linux baselines" → Run workflow
# Download artifact "linux-visual-snapshots" and replace:
#   tests/visual/public-pages.spec.js-snapshots/*.png

name: Visual Linux baselines

on:
  workflow_dispatch:

jobs:
  generate-validate-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
        env:
          VITE_API_URL: https://evsavari-api.onrender.com
          VITE_GA_ID: G-E2ETEST

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Update all visual baselines (Linux canonical)
        run: npm run test:visual:update
        env:
          CI: "1"
          PLAYWRIGHT_SKIP_BUILD: "1"

      - name: Verify baseline inventory (168 PNGs)
        run: node scripts/verify-visual-baselines.mjs --require-webkit

      - name: Visual regression validation (no snapshot update)
        run: npm run test:visual
        env:
          CI: "1"
          PLAYWRIGHT_SKIP_BUILD: "1"

      - name: Upload Linux snapshot PNGs
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-snapshots
          path: tests/visual/public-pages.spec.js-snapshots/*.png
          retention-days: 14
          if-no-files-found: error

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-linux-baselines-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
