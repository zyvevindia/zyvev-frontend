# Lightweight production-safe CI — build + smoke suites (no deploy).
# Triggers: PRs and pushes to default integration branches.

name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deployment repo validation (static, no install)
        run: node scripts/deployment-repo-validation.mjs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build (Vite + SEO artifacts)
        run: npm run build
        env:
          VITE_API_URL: https://evsavari-api.onrender.com
          VITE_GA_ID: G-E2ETEST

      - name: Media verification (certification gate)
        run: npm run media:verify
        env:
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}

      - name: Catalog certification (strict gate)
        run: npm run catalog:certify:strict

      - name: Upload catalog certification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-certification-reports
          path: reports/catalog-certification/
          retention-days: 14

      - name: Post-launch smoke suite (SEO QA, trust, soft-launch, catalog-ops, intelligence, usage-learning)
        run: npm run post-launch:smoke

      - name: Catalog ingestion smoke
        run: npm run ingestion:smoke

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: E2E functional tests (Playwright)
        run: npm run test:e2e
        env:
          CI: "1"
          PLAYWRIGHT_SKIP_BUILD: "1"

      - name: Visual baseline governance validation
        run: npm run visual:baseline:validate:strict

      - name: Visual baseline governance unit tests
        run: npm run visual:baseline:test

      - name: Visual certification evidence
        run: npm run visual:certification:strict
        env:
          CI: "1"
          PLAYWRIGHT_SKIP_BUILD: "1"

      - name: Upload visual certification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-certification-reports
          path: reports/visual/
          retention-days: 14

      - name: Visual regression (Playwright)
        run: npm run test:visual
        env:
          CI: "1"
          PLAYWRIGHT_SKIP_BUILD: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      # Optional: enable when eslint is clean on main
      # - name: Lint
      #   run: npm run lint
